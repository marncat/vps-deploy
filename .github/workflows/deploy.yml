name: Deploy artifact to VPS

on:
  workflow_call:
    inputs:
      project:
        description: Server-side deployctl project name
        required: true
        type: string
      artifact_name:
        description: Artifact containing exactly one release.tar.gz
        required: false
        default: deployable
        type: string
    secrets:
      vps_host:
        required: true
      vps_port:
        required: true
      vps_ssh_key:
        required: true
      vps_known_hosts:
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: vps-deploy-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - name: Download deployable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/deploy-artifact

      - name: Locate release archive
        id: artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly artifact_dir="$RUNNER_TEMP/deploy-artifact"
          mapfile -d '' files < <(find "$artifact_dir" ! -type d -print0)
          if [[ ${#files[@]} -ne 1 || ${files[0]##*/} != release.tar.gz ||
                ! -f ${files[0]} || -L ${files[0]} ||
                ${files[0]} == *$'\n'* || ${files[0]} == *$'\r'* ]]; then
            echo "::error::Artifact must contain exactly one regular file named release.tar.gz."
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Deploy release through shared action
        uses: marncat/vps-deploy@e761f193c36447568bdbc83c72847809dc547b5e
        with:
          project: ${{ inputs.project }}
          archive_path: ${{ steps.artifact.outputs.path }}
          vps_host: ${{ secrets.vps_host }}
          vps_port: ${{ secrets.vps_port }}
          vps_ssh_key: ${{ secrets.vps_ssh_key }}
          vps_known_hosts: ${{ secrets.vps_known_hosts }}
